name: Build Tuma APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev libffi7
        sudo apt-get install -y pipewire-audio-client-libraries libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
        sudo apt-get install -y openjdk-17-jdk
        sudo apt-get install -y autoconf automake libtool pkg-config

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Generate Buildozer Specification
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Tuma
        package.name = tuma
        package.domain = org.tuma
        source.dir = .
        source.include_exts = py,png,jpg
        version = 1.0
        requirements = python3,kivy==2.3.0,flask,jinja2,werkzeug,itsdangerous,click,setuptools
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        EOF

    # CLEAN FIX: Internally forces automated compliance for the Android SDK Manager
    - name: Build Android APK
      run: |
        export USE_GRADLE=1
        export APP_ANDROID_ACCEPT_SDK_LICENSE="1"
        buildozer android debug
